# Conda environment for doex (matches pyproject.toml runtime deps).
#
#   conda env create -f environment.yml
#   conda activate doex
#   doex doctor
#
# Channels: conda-forge (PyQt5 / scientific stack).
name: doex
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - numpy>=1.24,<3
  - pandas>=2.0,<3.1
  - scikit-learn>=1.3,<1.8
  - matplotlib>=3.7,<3.11
  - pyqt>=5.15,<6
  # Editable install of this repo (needs pip section).
  - pip:
      - -e .
